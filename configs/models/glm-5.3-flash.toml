# GLM via 火山引擎（Responses 端点；优先协议——见 Docs/Design/08-llm.md；
# 便宜，测试用——见 Docs/LLM-providers.md）。completion 降级见 *-completion.toml。
# 采样参数留空 = 不下发，用端点默认。
protocol       = "openai-response"
base_url       = "https://ark.cn-beijing.volces.com/api/plan/v3"
model          = "glm-5.3-flash"
key_env        = "VOLCENGINE_API_KEY"
context_window = 1048576   # 1024k（信息性，暂不使用）
output_length  = 131072    # 128k（下发为 max_output_tokens；端点默认上限远低于此）
