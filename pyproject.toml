[project]
name = "batch-doc-process-v2"
version = "0.1.0"
description = "Block-addressable document IR for agent editing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hipe-ocrepair-scorer",
    "httpx>=0.28.1",
    "litellm[mcp]==1.106.0",
    "rich>=15.0.0",
    "tenacity>=9,<10",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "hypothesis>=6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceio", "src/partition", "src/ir", "src/reconstruction", "src/view", "src/surface", "src/application", "src/llm", "src/agent", "src/evalkit", "src/datasetkit", "src/experiment"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "--basetemp=.pytest-tmp -m 'not live'"  # 本机 Temp 目录被锁（pitfalls.md #10）；live 需手动 -m live
markers = [
    "live: 真实 API 请求冒烟（默认排除，用 -m live 启用）",
]

[tool.uv.workspace]
members = [
    "related_source/HIPE-OCRepair-scorer-0.9.9",
]

[tool.uv.sources]
hipe-ocrepair-scorer = { workspace = true, editable = true }
