[project]
name = "batch-doc-process-v2"
version = "0.1.0"
description = "Block-addressable document IR for agent editing"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = ["pytest>=8", "hypothesis>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sourceio", "src/partition", "src/ir", "src/reconstruction", "src/view", "src/surface", "src/application"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
